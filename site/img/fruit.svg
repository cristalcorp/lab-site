<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="titre-fruit">
  <title id="titre-fruit">Fruit de la passion entier, à côté d'une moitié coupée montrant la pulpe jaune et les graines sombres</title>
