<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="titre-fleur">
  <title id="titre-fleur">Fleur de passiflore vue de face : cinq pétales violets, une couronne de filaments et trois styles au centre</title>
  <!-- Sépales verts, derrière les pétales -->
  <g fill="#2f6b3a" stroke="#1f4a28" stroke-width="1.5">
    <ellipse cx="100" cy="58" rx="13" ry="40" transform="rotate(36 100 100)"/>
    <ellipse cx="100" cy="58" rx="13" ry="40" transform="rotate(108 100 100)"/>
    <ellipse cx="100" cy="58" rx="13" ry="40" transform="rotate(180 100 100)"/>
    <ellipse cx="100" cy="58" rx="13" ry="40" transform="rotate(252 100 100)"/>
    <ellipse cx="100" cy="58" rx="13" ry="40" transform="rotate(324 100 100)"/>
  </g>
  <!-- Pétales -->
  <g fill="#8a5cb8" stroke="#4a2a6b" stroke-width="1.5">
    <ellipse cx="100" cy="55" rx="20" ry="44"/>
    <ellipse cx="100" cy="55" rx="20" ry="44" transform="rotate(72 100 100)"/>
    <ellipse cx="100" cy="55" rx="20" ry="44" transform="rotate(144 100 100)"/>
    <ellipse cx="100" cy="55" rx="20" ry="44" transform="rotate(216 100 100)"/>
    <ellipse cx="100" cy="55" rx="20" ry="44" transform="rotate(288 100 100)"/>
  </g>
  <!-- Couronne de filaments -->
  <circle cx="100" cy="100" r="34" fill="#f2d4f7" stroke="#4a2a6b" stroke-width="1"/>
  <circle cx="100" cy="100" r="26" fill="none" stroke="#5b2a86" stroke-width="3" stroke-dasharray="2 4"/>
  <!-- Centre et styles -->
  <circle cx="100" cy="100" r="8" fill="#e8c547" stroke="#7a6410" stroke-width="1"/>
  <g stroke="#2f6b3a" stroke-width="3">
    <line x1="100" y1="100" x2="100" y2="76"/>
    <line x1="100" y1="100" x2="100" y2="76" transform="rotate(120 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="76" transform="rotate(240 100 100)"/>
  </g>
  <g fill="#e8c547" stroke="#7a6410" stroke-width="1">
    <circle cx="100" cy="76" r="4"/>
    <circle cx="100" cy="76" r="4" transform="rotate(120 100 100)"/>
    <circle cx="100" cy="76" r="4" transform="rotate(240 100 100)"/>
  </g>
</svg>
